[package]
name = "omni"
# Tracks the workspace next door. The app ships the daemon and the CLI from
# those crates, so three different version numbers for one install would only
# be confusing — `tauri.conf.json` carries the same one.
version = "0.8.0"
description = "Control multiple computers from a single keyboard and mouse"
authors = ["Jonatan"]
edition = "2021"

# Its own workspace root. The repo root workspace is `crates/*` only, and the
# Rust quality gate (`cargo build --workspace`) must not pull in Tauri or the
# webview toolchain — that stays a concern of this client alone.
[workspace]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "omni_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` keeps the app alive in the system tray once the window is closed.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# A connection request needs answering promptly, and the window is usually
# closed when one arrives. The tray menu makes it actionable; this makes it
# noticed.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The daemon itself. This client embeds it rather than talking to a separately
# installed one, so the user installs a single app and nothing else. The core
# is used as-is: this crate adds no business logic on top of it.
omni-runtime = { path = "../../crates/omni-runtime" }
