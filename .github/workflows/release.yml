name: Release

# Cut a release by pushing a version tag (e.g. `v0.1.0`). This builds the
# `omni` binary natively on each platform, packages it, and attaches the
# archives — plus the install scripts — to a GitHub Release. End users never
# build from source (no Rust toolchain, no C compiler): they download a
# prebuilt binary with the one-liners in the README.
#
# The native Windows GUI (WinUI 3, `clients/omni-windows`) is also built
# self-contained and attached as `omni-gui-<target>.zip`, so it runs without
# installing .NET. Both the CLI and the GUI ship for x64 and arm64, so an Arm
# Windows machine is not left without a build.
#
# The cross-platform desktop app (Tauri, `omni/`) ships as an installer per
# platform — `omni-desktop-<target>`. It is the one download that is the whole
# product: the daemon runs inside it and the `omni` CLI is bundled alongside,
# both built from this same tag, so its version is checked against the
# workspace before it is built.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build on the Apple-silicon runner: arm64 native,
          # x86_64 cross-compiled (the Apple toolchain targets both). This avoids
          # depending on the older Intel `macos-13` runner.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Arm64 Windows is cross-compiled from the x64 runner, the same way
          # the Intel Mac build comes off the Apple-silicon one.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, ${{ matrix.target }})
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin omni --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="omni-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" omni
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "omni-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/omni.exe" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File "$archive.sha256" -Encoding ascii

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            omni-${{ matrix.target }}.tar.gz
            omni-${{ matrix.target }}.tar.gz.sha256
            omni-${{ matrix.target }}.zip
            omni-${{ matrix.target }}.zip.sha256
          fail_on_unmatched_files: false

  scripts:
    name: attach install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach install scripts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            install.sh
            install.ps1

  windows-gui:
    name: build Windows GUI (WinUI 3, ${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            target: x86_64-pc-windows-msvc
          - rid: win-arm64
            platform: arm64
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        working-directory: clients/omni-windows
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Self-contained: the .zip carries the .NET runtime and the Windows App
      # SDK, so end users download and run it — no .NET install — the same deal
      # as the CLI. `-o publish` keeps the output path independent of the
      # target-framework moniker.
      - name: Publish (self-contained)
        run: >
          dotnet publish src/Omni.App/Omni.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:Platform=${{ matrix.platform }} -o publish

      - name: Package
        shell: pwsh
        run: |
          $archive = "omni-gui-${{ matrix.target }}.zip"
          Compress-Archive -Path "publish/*" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File "$archive.sha256" -Encoding ascii

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clients/omni-windows/omni-gui-${{ matrix.target }}.zip
            clients/omni-windows/omni-gui-${{ matrix.target }}.zip.sha256

  desktop:
    name: build desktop app (Tauri, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust (stable, ${{ matrix.target }})
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: omni
        run: bun install --frozen-lockfile

      # The app embeds the daemon and bundles the CLI beside it, both built from
      # this same commit, so all three must report one version. `tauri build`
      # checks this again itself; failing here makes the reason obvious.
      - name: Version matches the daemon
        working-directory: omni
        run: bun run check-version

      # Also stages the `omni` CLI as a sidecar, cross-built for this target, so
      # installing the app installs the command too.
      - name: Build
        working-directory: omni
        run: bun run tauri build --target ${{ matrix.target }}

      # Bundle file names carry the version and Tauri's own arch spelling. They
      # are renamed to the target triple so the release assets match the CLI's
      # naming and a download is unambiguous.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle="omni/src-tauri/target/${{ matrix.target }}/release/bundle"
          dmg=$(find "$bundle/dmg" -name '*.dmg' | head -1)
          cp "$dmg" "omni-desktop-${{ matrix.target }}.dmg"
          shasum -a 256 "omni-desktop-${{ matrix.target }}.dmg" > "omni-desktop-${{ matrix.target }}.dmg.sha256"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle="omni/src-tauri/target/${{ matrix.target }}/release/bundle"
          appimage=$(find "$bundle/appimage" -name '*.AppImage' | head -1)
          deb=$(find "$bundle/deb" -name '*.deb' | head -1)
          cp "$appimage" "omni-desktop-${{ matrix.target }}.AppImage"
          cp "$deb" "omni-desktop-${{ matrix.target }}.deb"
          for f in "omni-desktop-${{ matrix.target }}.AppImage" "omni-desktop-${{ matrix.target }}.deb"; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "omni/src-tauri/target/${{ matrix.target }}/release/bundle"
          $installer = Get-ChildItem -Path $bundle -Recurse -Include *.exe, *.msi | Select-Object -First 1
          $name = "omni-desktop-${{ matrix.target }}$($installer.Extension)"
          Copy-Item $installer.FullName $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File "$name.sha256" -Encoding ascii

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            omni-desktop-${{ matrix.target }}.dmg
            omni-desktop-${{ matrix.target }}.dmg.sha256
            omni-desktop-${{ matrix.target }}.AppImage
            omni-desktop-${{ matrix.target }}.AppImage.sha256
            omni-desktop-${{ matrix.target }}.deb
            omni-desktop-${{ matrix.target }}.deb.sha256
            omni-desktop-${{ matrix.target }}.exe
            omni-desktop-${{ matrix.target }}.exe.sha256
            omni-desktop-${{ matrix.target }}.msi
            omni-desktop-${{ matrix.target }}.msi.sha256
          fail_on_unmatched_files: false
