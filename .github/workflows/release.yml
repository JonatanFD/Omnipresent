name: Release

# Cut a release by pushing a version tag (e.g. `v0.1.0`).
#
# Six assets, three per platform pair:
#
#   omni-desktop-<os>-<arch>   the desktop app — the whole product in one
#                              install: the window, the daemon it runs inside
#                              itself, and the `omni` command bundled beside it
#   omni-cli-<os>-<arch>       the command on its own, for a headless machine
#                              or anyone who does not want a GUI
#
# One job per platform, not one per artifact. Building the desktop app already
# cross-builds the CLI — it is bundled as a sidecar — so the same job publishes
# both and the CLI costs no extra time. End users never build from source.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ships for Apple silicon: it is what the runner is, and what
          # every Mac sold for years has been.
          - runner: macos-latest
            os: macos
            arch: arm64
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            os: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            os: windows
            arch: x64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust (stable, ${{ matrix.target }})
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            omni/src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: omni
        run: bun install --frozen-lockfile

      # The app embeds the daemon and bundles the CLI, both built from this tag,
      # so one install is one version. Checked before anything is built.
      - name: Version matches the daemon
        working-directory: omni
        run: bun run check-version

      # Builds the CLI for this target and stages it as the app's sidecar, then
      # bundles the app around it. Both release assets come out of this step.
      - name: Build
        working-directory: omni
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="${{ matrix.os }}-${{ matrix.arch }}"
          bundle="omni/src-tauri/target/${{ matrix.target }}/release/bundle"

          # The CLI, archived rather than bare so the executable bit survives
          # the download.
          tar -czf "omni-cli-$name.tar.gz" -C "target/${{ matrix.target }}/release" omni

          # The desktop app: a .dmg on macOS, an AppImage on Linux — the format
          # each platform expects to be handed.
          if [ "${{ matrix.os }}" = "macos" ]; then
            cp "$(find "$bundle/dmg" -name '*.dmg' | head -1)" "omni-desktop-$name.dmg"
          else
            cp "$(find "$bundle/appimage" -name '*.AppImage' | head -1)" "omni-desktop-$name.AppImage"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ matrix.os }}-${{ matrix.arch }}"
          $bundle = "omni/src-tauri/target/${{ matrix.target }}/release/bundle"

          Compress-Archive -Path "target/${{ matrix.target }}/release/omni.exe" `
            -DestinationPath "omni-cli-$name.zip"

          $installer = Get-ChildItem -Path $bundle -Recurse -Include *.exe, *.msi |
            Select-Object -First 1
          Copy-Item $installer.FullName "omni-desktop-$name.exe"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            omni-cli-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            omni-cli-${{ matrix.os }}-${{ matrix.arch }}.zip
            omni-desktop-${{ matrix.os }}-${{ matrix.arch }}.dmg
            omni-desktop-${{ matrix.os }}-${{ matrix.arch }}.AppImage
            omni-desktop-${{ matrix.os }}-${{ matrix.arch }}.exe
          fail_on_unmatched_files: false

  scripts:
    name: attach install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Not builds — the two files the documented one-line installers fetch.
      # Removing them would break `curl ... | sh`.
      - name: Attach install scripts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            install.sh
            install.ps1
